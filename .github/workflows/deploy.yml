name: Deploy to VPS on Push

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 📤 Copy Files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 72.244.153.23
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "bot.py,downloader.py,config.py,requirements.txt"
          target: "/opt/media-downloader-bot"
          overwrite: true

      - name: 🔄 Restart Telegram Bot Service on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.244.153.23
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            cd /opt/media-downloader-bot
            ./venv/bin/pip install --no-cache-dir -r requirements.txt beautifulsoup4
            systemctl restart media-downloader-bot
            sleep 2
            systemctl status media-downloader-bot --no-pager
